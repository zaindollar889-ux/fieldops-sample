<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TU FieldOps</title><style>
:root{--g:#0f4d36;--bg:#f1f6f3;--b:#d9e4de;--m:#6a7b72}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:#14241c;padding-bottom:70px}
#app{max-width:560px;margin:auto}.adm #app{max-width:980px}
header{background:var(--g);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5}.adm header{background:#06261b;border-bottom:3px solid #e0b44c}
.top,.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
small,.m{color:var(--m);font-size:13px}header small{color:#cfe6da}
.roles{display:flex;gap:6px;margin-top:8px;overflow:auto}
.roles button,.tabs button,.fl button{border:1px solid var(--b);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;white-space:nowrap;cursor:pointer}
.roles button{background:transparent;color:#fff;border-color:#fff5}.roles .on{background:#fff;color:var(--g);font-weight:700}
.tabs,.fl{display:flex;gap:6px;overflow:auto;padding:10px 12px}.tabs .on,.fl .on{background:var(--g);color:#fff;border-color:var(--g)}.adm .tabs .on{background:#06261b;color:#e0b44c}
main{padding:0 12px 12px}.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px}.click{cursor:pointer}
.chip{border-radius:99px;padding:2px 10px;font-size:12px;color:#fff;white-space:nowrap}
.s0{background:#2563a8}.s1{background:#7a4fb5}.s2{background:#d98a00}.s3{background:#1a8f5a}.s4{background:#c0392b}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer;display:inline-block}
.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.d{background:#c0392b}.btn:disabled{opacity:.4;cursor:not-allowed}
.sm{padding:5px 10px;font-size:13px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--b)}.kv b{text-align:end;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.adm .grid{grid-template-columns:repeat(3,1fr)}
.st{background:#fff;border-radius:14px;padding:14px;border-inline-start:6px solid;cursor:pointer}.st b{font-size:28px;display:block}
.ph{text-align:center}.pv{height:90px;border:2px dashed var(--b);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:4px 0;font-size:26px}.pv img{width:100%;height:100%;object-fit:cover}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:10px;font:inherit;margin:3px 0 8px;background:#fff}
.lb{font-size:13px;color:var(--m)}.lkb{background:#fff4d6;border:1px solid #e0b44c;border-radius:10px;padding:8px;margin-bottom:8px}
.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto;margin:0}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--b);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:12px;font:inherit;color:var(--m)}nav .on{color:var(--g);font-weight:700}
#mod{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
#mod>div{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:85vh;overflow:auto}
#toast{position:fixed;bottom:80px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:20}
</style></head><body><div id="app"></div><script>
const S=['New','Assigned','In Progress','Fixed','Not Fixed'],PS=['Due','Done','Overdue'];
const T={app:['TU FieldOps','تي يو فيلد أوبس'],adminp:['Admin Panel','لوحة الإدارة'],teamp:['Team Panel','لوحة الفريق'],admin:['Admin','المدير'],pm:['Project Manager','مدير المشروع'],eng:['Engineer','مهندس'],tech:['Technician','فني'],dash:['Dashboard','لوحة المعلومات'],orders:['Job Orders','أوامر العمل'],devices:['Devices','الأجهزة'],users:['Users','المستخدمون'],ppm:['PPM','الصيانة الوقائية'],total:['Total orders','إجمالي الأوامر'],povd:['PPM overdue','صيانة متأخرة'],all:['All','الكل'],New:['New','جديد'],Assigned:['Assigned','مسند'],'In Progress':['In Progress','قيد التنفيذ'],Fixed:['Fixed','تم الإصلاح'],'Not Fixed':['Not Fixed','لم يتم الإصلاح'],Due:['Due','مستحقة'],Done:['Done','منجزة'],Overdue:['Overdue','متأخرة'],neworder:['New order','أمر عمل جديد'],device:['Device','الجهاز'],location:['Machine location','موقع الجهاز'],room:['Room','الغرفة'],problem:['Problem description','وصف المشكلة'],status:['Status','الحالة'],team:['Assigned team','الفريق المكلّف'],none:['Not assigned','غير مسند'],assign:['Assign team','إسناد فريق'],edit:['Edit','تعديل'],delete:['Delete','حذف'],unlock:['Unlock report','فتح التقرير'],start:['Start work','بدء العمل'],save:['Save','حفظ'],cancel:['Cancel','إلغاء'],back:['Back','رجوع'],upload:['Upload','رفع'],photos:['Photos','الصور'],ph_wo:['Work Order photo','صورة أمر العمل'],ph_ppm:['PPM Form photo','صورة نموذج الصيانة'],ph_stk:['PPM Sticker photo','صورة ملصق الصيانة'],ph_mach:['Machine photo','صورة الجهاز'],report:['Job report','تقرير العمل'],result:['Result','النتيجة'],reason:['Reason (required if Not Fixed)','السبب (مطلوب عند عدم الإصلاح)'],parts:['Spare parts needed','قطع الغيار المطلوبة'],submit:['Submit & lock report','إرسال وقفل التقرير'],lockedmsg:['Report submitted and locked. Only Admin can unlock it.','تم إرسال التقرير وقفله. يمكن للمدير فقط فتحه.'],pmnote:['Only Engineers/Technicians submit reports. You can assign teams and upload photos.','يقدّم التقارير المهندسون والفنيون فقط. يمكنك إسناد الفرق ورفع الصور.'],req:['Please fill all required fields','يرجى تعبئة الحقول المطلوبة'],last:['Last done','آخر تنفيذ'],due:['Next due','الاستحقاق القادم'],pphint:['Upload both photos to mark as Done. Repeats every 6 months.','ارفع الصورتين لتصبح منجزة. تتكرر كل 6 أشهر.'],reset:['Reset','إعادة تعيين'],add:['Add','إضافة'],ne:['Name (English)','الاسم (إنجليزي)'],na:['Name (Arabic)','الاسم (عربي)'],code:['Code','الرمز'],role:['Role','الدور'],confirm:['Confirm delete','تأكيد الحذف'],delmsg:['This cannot be undone.','لا يمكن التراجع.'],saved:['Saved','تم الحفظ']};
let L='en',role='admin',tab='dash',sel=null,pd=null,flt='all',M=null,nid=7,did=7,uid=6;
const $=i=>document.getElementById(i),t=k=>(T[k]||[k,k])[L=='ar'?1:0],nm=o=>o?(L=='ar'&&o.na||o.ne):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),add6=d=>{const x=new Date(d);x.setMonth(x.getMonth()+6);return x.toISOString().slice(0,10)};
const D=[{id:1,ne:'Centrifuge',na:'جهاز الطرد المركزي',code:'CF-101',loc:'Bldg A – Chemistry Lab'},{id:2,ne:'UV-Vis Spectrophotometer',na:'مقياس الطيف UV-Vis',code:'UV-205',loc:'Bldg B – Analytical Lab'},{id:3,ne:'Olympus CX23 Microscope',na:'مجهر أوليمبوس CX23',code:'MC-310',loc:'Bldg C – Biology Lab'},{id:4,ne:'Autoclave',na:'جهاز التعقيم (أوتوكلاف)',code:'AC-014',loc:'Bldg A – Sterilization Room'},{id:5,ne:'Incubator',na:'حاضنة',code:'IN-112',loc:'Bldg C – Microbiology Lab'},{id:6,ne:'pH Meter',na:'جهاز قياس الحموضة',code:'PH-120',loc:'Bldg B – Water Lab'}];
const U=[{id:1,ne:'Khalid Al-Harbi',na:'خالد الحربي',role:'admin'},{id:2,ne:'Sara Al-Qahtani',na:'سارة القحطاني',role:'pm'},{id:3,ne:'Omar Hassan',na:'عمر حسن',role:'eng'},{id:4,ne:'Layla Nasser',na:'ليلى ناصر',role:'eng'},{id:5,ne:'Yusuf Ali',na:'يوسف علي',role:'tech'}];
const P={1:{st:'Done',last:'2026-07-10',due:'2027-01-10'},2:{st:'Due',last:'2026-04-25',due:'2026-10-25'},3:{st:'Overdue',last:'2026-02-15',due:'2026-08-15'},4:{st:'Done',last:'2026-08-01',due:'2027-02-01'},5:{st:'Due',last:'2026-04-12',due:'2026-10-12'},6:{st:'Overdue',last:'2026-01-30',due:'2026-07-30'}};
const mk=(id,dev,loc,room,desc,status,team,res,reason,parts)=>({id,dev,loc,room,desc,status,team,ph:{},res:res||'',reason:reason||'',parts:parts||'',locked:status=='Fixed'||status=='Not Fixed'});
const O=[mk(1,1,'Bldg A – Chemistry Lab','A-102','Vibrates and makes noise at high speed','New',[]),mk(2,2,'Bldg B – Analytical Lab','B-210','Lamp error on startup','Assigned',[3]),mk(3,3,'Bldg C – Biology Lab','C-005','Light flickers, focus knob is stiff','In Progress',[4,5]),mk(4,4,'Bldg A – Sterilization Room','A-014','Does not reach 121°C','Fixed',[3],'fixed','','Heating element'),mk(5,5,'Bldg C – Microbiology Lab','C-112','Temperature unstable','Not Fixed',[4],'notfixed','Control board unavailable, awaiting supplier','Thermostat control board'),mk(6,6,'Bldg B – Water Lab','B-120','Readings drift, calibration fails','Assigned',[4,5])];
const dv=i=>D.find(d=>d.id==i),us=i=>U.find(u=>u.id==i),cur=()=>U.find(u=>u.role==role),oo=i=>O.find(o=>o.id==i);
const A=()=>role=='admin',F=()=>role=='eng'||role=='tech',jo=o=>'JO-'+String(o.id).padStart(3,'0');
const chip=s=>`<span class="chip s${S.indexOf(s)}">${t(s)}</span>`,pchip=s=>`<span class="chip s${[2,3,4][PS.indexOf(s)]}">${t(s)}</span>`;
const kv=(k,v)=>`<div class="kv"><span class="m">${k}</span><b>${v}</b></div>`;
function toast(m){const e=document.createElement('div');e.id='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)}
const rd=(i,cb)=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
const slot=(k,img,can,fn)=>`<div class="ph"><div class="lb">${t(k)}</div><div class="pv">${img?`<img src="${img}">`:'📷'}</div>${can?`<label class="btn sm">${t('upload')}<input type="file" accept="image/*" hidden onchange="${fn}"></label>`:'<button class="btn sm" disabled>🔒</button>'}</div>`;
function head(){return `<header><div class="top"><div><b>🌿 ${t('app')}</b><br><small>${A()?t('adminp'):t('teamp')} · ${nm(cur())}</small></div><button class="btn sm o" onclick="L=L=='en'?'ar':'en';render()">${L=='en'?'العربية':'English'}</button></div><div class="roles">${['admin','pm','eng','tech'].map(r=>`<button class="${r==role?'on':''}" onclick="sr('${r}')">${t(r)}</button>`).join('')}</div></header>`}
function sr(r){role=r;tab=r=='admin'?'dash':'orders';sel=pd=null;flt='all';render()}
function go(k){tab=k;sel=pd=null;render()}
function render(){const y=scrollY;document.body.className=A()?'adm':'';document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';
const b=sel!=null?detail(oo(sel)):pd!=null?pdet(pd):A()?admin():team();
$('app').innerHTML=head()+b+(A()?'':nav())+modal();scrollTo(0,y)}
const nav=()=>`<nav>${['orders','ppm'].map(k=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${k=='orders'?'📋':'🛠️'} ${t(k)}</button>`).join('')}</nav>`;
const team=()=>tab=='ppm'?ppml():olist();
function admin(){let h=`<div class="tabs">${['dash','orders','devices','users','ppm'].map(k=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('')}</div>`;
if(tab=='dash')h+=dash();else if(tab=='orders')h+=`<main><button class="btn" onclick="eo()">＋ ${t('neworder')}</button></main>`+olist();else if(tab=='devices')h+=devs();else if(tab=='users')h+=usrs();else h+=ppml();return h}
function dash(){const c=s=>O.filter(o=>o.status==s).length,st=(k,n,col,f)=>`<div class="st" style="border-color:${col}" onclick="${f}"><b>${n}</b>${t(k)}</div>`,g=s=>`flt='${s}';go('orders')`;
return `<main><div class="grid">${st('total',O.length,'#0f4d36',g('all'))}${st('New',c('New'),'#2563a8',g('New'))}${st('In Progress',c('In Progress'),'#d98a00',g('In Progress'))}${st('Fixed',c('Fixed'),'#1a8f5a',g('Fixed'))}${st('Not Fixed',c('Not Fixed'),'#c0392b',g('Not Fixed'))}${st('povd',Object.values(P).filter(p=>p.st=='Overdue').length,'#c0392b',"go('ppm')")}</div></main>`}
const fl=()=>`<div class="fl">${['all',...S].map(s=>`<button class="${flt==s?'on':''}" onclick="flt='${s}';render()">${t(s)} (${s=='all'?O.length:O.filter(o=>o.status==s).length})</button>`).join('')}</div>`;
const card=o=>{const d=dv(o.dev);return `<div class="card click" onclick="sel=${o.id};render()"><div class="row"><b>${jo(o)} ${o.locked?'🔒':''}</b>${chip(o.status)}</div><div>${esc(nm(d))} <small>${d?d.code:''}</small></div><div class="m">${esc(o.loc)||'—'} · ${esc(o.room)||'—'}</div><div class="m">👥 ${esc(o.team.map(i=>nm(us(i))).join(', ')||t('none'))}</div></div>`};
const olist=()=>fl()+`<main>${O.filter(o=>flt=='all'||o.status==flt).slice().reverse().map(card).join('')}</main>`;
const ppml=()=>`<main>${D.map(d=>{const p=P[d.id];return `<div class="card click" onclick="pd=${d.id};render()"><div class="row"><b>${esc(nm(d))}</b>${pchip(p.st)}</div><div class="m">${d.code} · ${t('due')}: ${p.due}</div></div>`}).join('')}</main>`;
function detail(o){if(!o)return '';const d=dv(o.dev),canP=A()||role=='pm'||(F()&&!o.locked);
return `<main><p><button class="btn o sm" onclick="sel=null;render()">← ${t('back')}</button></p><div class="card"><div class="row"><b>${jo(o)}</b>${chip(o.status)}</div>${o.locked?`<div class="lkb">🔒 ${t('lockedmsg')}</div>`:''}${kv(t('device'),esc(nm(d))+' · '+(d?d.code:''))}${kv(t('location'),esc(o.loc)||'—')}${kv(t('room'),esc(o.room)||'—')}${kv(t('problem'),esc(o.desc))}${kv(t('team'),esc(o.team.map(i=>nm(us(i))).join(', ')||t('none')))}
<div class="acts"><button class="btn" ${A()||role=='pm'?'':'disabled'} onclick="as(${o.id})">👥 ${t('assign')}</button>${F()?`<button class="btn" ${o.locked||o.status=='In Progress'?'disabled':''} onclick="oo(${o.id}).status='In Progress';render()">▶ ${t('start')}</button>`:''}<button class="btn o" ${A()?'':'disabled'} onclick="eo(${o.id})">✏️ ${t('edit')}</button><button class="btn o" ${A()&&o.locked?'':'disabled'} onclick="ul(${o.id})">🔓 ${t('unlock')}</button><button class="btn d" ${A()?'':'disabled'} onclick="dl('o',${o.id})">🗑 ${t('delete')}</button></div></div>
<div class="card"><b>${t('photos')}</b><div class="pg">${['wo','ppm','stk','mach'].map(k=>slot('ph_'+k,o.ph[k],canP,`up(${o.id},'${k}',this)`)).join('')}</div></div>${rep(o)}</main>`}
function rep(o){const h=`<div class="card"><b>${t('report')} ${o.locked?'🔒':''}</b><br>`;
if(o.locked)return h+`<div class="lkb">${t('lockedmsg')}</div>${kv(t('location'),esc(o.loc))}${kv(t('room'),esc(o.room))}${kv(t('result'),t(o.res=='fixed'?'Fixed':'Not Fixed'))}${o.res=='notfixed'?kv(t('reason'),esc(o.reason)):''}${kv(t('parts'),esc(o.parts)||'—')}</div>`;
if(!(F()||A()))return h+`<div class="m">${t('pmnote')}</div><br><button class="btn" disabled>${t('submit')}</button></div>`;
const d=o.d=o.d||{loc:o.loc,room:o.room,res:o.res,reason:o.reason,parts:o.parts};
const i=(k,l,a)=>`<div class="lb">${l}</div>`+(a?`<textarea rows="2" oninput="oo(${o.id}).d.${k}=this.value">${esc(d[k])}</textarea>`:`<input value="${esc(d[k])}" oninput="oo(${o.id}).d.${k}=this.value">`);
return h+i('loc',t('location')+' *')+i('room',t('room')+' *')+`<div class="lb">${t('result')} *</div><div class="acts">${['fixed','notfixed'].map(r=>`<label class="ck"><input type="radio" name="r" ${d.res==r?'checked':''} onchange="oo(${o.id}).d.res='${r}';render()"> ${t(r=='fixed'?'Fixed':'Not Fixed')}</label>`).join('')}</div>`+(d.res=='notfixed'?i('reason',t('reason')+' *',1):'')+i('parts',t('parts'),1)+`<button class="btn" onclick="sb(${o.id})">${t('submit')}</button></div>`}
function sb(id){const o=oo(id),d=o.d;if(!d.loc.trim()||!d.room.trim()||!d.res||(d.res=='notfixed'&&!d.reason.trim()))return toast(t('req'));Object.assign(o,d,{status:d.res=='fixed'?'Fixed':'Not Fixed',locked:true});delete o.d;toast(t('saved'));render()}
function ul(id){const o=oo(id);o.locked=false;o.status='In Progress';delete o.d;render()}
function up(id,k,i){rd(i,v=>{oo(id).ph[k]=v;render()})}
function as(id){const o=oo(id);openM(t('assign'),[{k:'team',l:t('team'),t:'chk',o:U.filter(u=>u.role!='admin').map(u=>[u.id,nm(u)+' ('+t(u.role)+')']),v:o.team}],v=>{o.team=v.team;if(v.team.length&&o.status=='New')o.status='Assigned';if(!v.team.length&&o.status=='Assigned')o.status='New'})}
function eo(id){const o=id?oo(id):null,f=[{k:'dev',l:t('device'),t:'select',o:D.map(d=>[d.id,nm(d)+' ('+d.code+')']),v:o?o.dev:D[0]&&D[0].id},{k:'loc',l:t('location'),v:o?o.loc:''},{k:'room',l:t('room'),v:o?o.room:''},{k:'desc',l:t('problem'),t:'area',v:o?o.desc:''}];
if(o)f.push({k:'status',l:t('status'),t:'select',o:S.map(s=>[s,t(s)]),v:o.status},{k:'res',l:t('result'),t:'select',o:[['','—'],['fixed',t('Fixed')],['notfixed',t('Not Fixed')]],v:o.res},{k:'reason',l:t('reason'),t:'area',v:o.reason},{k:'parts',l:t('parts'),t:'area',v:o.parts});
openM(t(o?'edit':'neworder'),f,v=>{v.dev=+v.dev;if(o){if(v.res=='notfixed'&&!v.reason.trim()){toast(t('req'));return false}Object.assign(o,v);delete o.d}else O.push({id:nid++,...v,status:'New',team:[],ph:{},res:'',reason:'',parts:'',locked:false})})}
function pdet(id){const d=dv(id),p=P[id];return `<main><p><button class="btn o sm" onclick="pd=null;render()">← ${t('back')}</button></p><div class="card"><div class="row"><b>${esc(nm(d))}</b>${pchip(p.st)}</div>${kv(t('code'),d.code)}${kv(t('location'),esc(d.loc))}${kv(t('last'),p.last||'—')}${kv(t('due'),p.due)}<div class="m">${t('pphint')}</div></div><div class="card"><div class="pg">${slot('ph_ppm',p.form,1,`pu(${id},'form',this)`)}${slot('ph_stk',p.stk,1,`pu(${id},'stk',this)`)}</div></div><div class="acts"><button class="btn o" ${A()?'':'disabled'} onclick="ep(${id})">✏️ ${t('edit')}</button><button class="btn d" ${A()?'':'disabled'} onclick="rp(${id})">${t('reset')}</button></div></main>`}
function pu(id,k,i){rd(i,v=>{const p=P[id];p[k]=v;if(p.form&&p.stk&&p.st!='Done'){p.st='Done';p.last=today();p.due=add6(p.last);toast(t('Done')+' → '+p.due)}render()})}
function ep(id){const p=P[id];openM(t('edit'),[{k:'st',l:t('status'),t:'select',o:PS.map(s=>[s,t(s)]),v:p.st},{k:'last',l:t('last'),t:'date',v:p.last},{k:'due',l:t('due'),t:'date',v:p.due}],v=>Object.assign(p,v))}
function rp(id){openM(t('reset'),[],()=>Object.assign(P[id],{st:'Due',form:null,stk:null}),t('delmsg'))}
const devs=()=>`<main><button class="btn" onclick="ed()">＋ ${t('add')}</button><br><br>${D.map(d=>`<div class="card"><div class="row"><b>${esc(nm(d))}</b><small>${d.code}</small></div><div class="m">${esc(d.loc)}</div><div class="acts"><button class="btn o sm" onclick="ed(${d.id})">${t('edit')}</button><button class="btn d sm" onclick="dl('d',${d.id})">${t('delete')}</button></div></div>`).join('')}</main>`;
const usrs=()=>`<main><button class="btn" onclick="eu()">＋ ${t('add')}</button><br><br>${U.map(u=>`<div class="card"><div class="row"><b>${esc(nm(u))}</b><small>${t(u.role)}</small></div><div class="acts"><button class="btn o sm" onclick="eu(${u.id})">${t('edit')}</button><button class="btn d sm" onclick="dl('u',${u.id})">${t('delete')}</button></div></div>`).join('')}</main>`;
function ed(id){const d=id?dv(id):{ne:'',na:'',code:'',loc:''};openM(t(id?'edit':'add'),['ne','na','code','loc'].map(k=>({k,l:t(k=='loc'?'location':k),v:d[k]})),v=>{if(!v.ne.trim()||!v.code.trim()){toast(t('req'));return false}if(id)Object.assign(d,v);else{const n={id:did++,...v};D.push(n);P[n.id]={st:'Due',last:'',due:today()}}})}
function eu(id){const u=id?us(id):{ne:'',na:'',role:'eng'};openM(t(id?'edit':'add'),[{k:'ne',l:t('ne'),v:u.ne},{k:'na',l:t('na'),v:u.na},{k:'role',l:t('role'),t:'select',o:['admin','pm','eng','tech'].map(r=>[r,t(r)]),v:u.role}],v=>{if(!v.ne.trim()){toast(t('req'));return false}if(id)Object.assign(u,v);else U.push({id:uid++,...v})})}
function dl(k,id){openM(t('confirm'),[],()=>{if(k=='o'){O.splice(O.findIndex(o=>o.id==id),1);sel=null}if(k=='d'){D.splice(D.findIndex(d=>d.id==id),1);delete P[id]}if(k=='u'){U.splice(U.findIndex(u=>u.id==id),1);O.forEach(o=>o.team=o.team.filter(i=>i!=id))}},t('delmsg'))}
function fld(f){let h=`<div class="lb">${f.l}</div>`;
if(f.t=='select')h+=`<select data-f="${f.k}">${f.o.map(([v,l])=>`<option value="${v}"${v==f.v?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
else if(f.t=='area')h+=`<textarea data-f="${f.k}" rows="3">${esc(f.v)}</textarea>`;
else if(f.t=='chk')h+=`<div data-chk="${f.k}">${f.o.map(([v,l])=>`<label class="ck"><input type="checkbox" value="${v}"${f.v.includes(v)?' checked':''}> ${esc(l)}</label>`).join('')}</div>`;
else h+=`<input data-f="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}">`;return h}
function openM(title,f,s,msg){M={t:title,f,s,msg};render()}
const modal=()=>M?`<div id="mod"><div><h3>${M.t}</h3>${M.msg?`<p>${M.msg}</p>`:''}${M.f.map(fld).join('')}<div class="acts"><button class="btn" onclick="ms()">${t('save')}</button><button class="btn o" onclick="M=null;render()">${t('cancel')}</button></div></div></div>`:'';
function ms(){const v={};document.querySelectorAll('#mod [data-f]').forEach(e=>v[e.dataset.f]=e.value);document.querySelectorAll('#mod [data-chk]').forEach(e=>v[e.dataset.chk]=[...e.querySelectorAll('input:checked')].map(i=>+i.value));if(M.s(v)!==false){M=null;render()}}
render();
</script></body></html>
